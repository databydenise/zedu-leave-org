<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#343477" />
    <title>Zedu — Channels</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <button class="workspace-switch" type="button">
          <span class="workspace-mark">H</span>
          <span class="workspace-name">HNG Internship</span>
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="m3 6 5 5 5-5" />
          </svg>
        </button>

        <div class="topbar-tools">
          <button class="icon-button" aria-label="Back" type="button">‹</button>
          <button class="icon-button" aria-label="Forward" type="button">
            ›
          </button>
          <button
            class="icon-button"
            aria-label="Recent activity"
            type="button"
          >
            ◷
          </button>

          <button class="search-bar" type="button">
            <span class="search-icon">⌕</span>
            <span>Search messages and people...</span>
            <kbd>Ctrl K</kbd>
          </button>
        </div>
      </header>

      <div class="workspace">
        <nav class="rail" aria-label="Main navigation">
          <div class="rail-primary">
            <button class="rail-item selected" type="button">
              <span class="rail-symbol">⌂</span>
              <span>Home</span>
            </button>
            <button class="rail-item" type="button">
              <span class="rail-symbol">☏</span>
              <span>DMs</span>
            </button>
            <button class="rail-item" type="button">
              <span class="rail-symbol">♙</span>
              <span>People</span>
            </button>
            <button class="rail-item" type="button">
              <span class="rail-symbol">▱</span>
              <span>Files</span>
            </button>
            <button class="rail-item" type="button">
              <span class="rail-symbol">♧</span>
              <span>Buzz</span>
            </button>
          </div>

          <div class="rail-bottom">
            <button class="rail-icon" aria-label="Notifications" type="button">
              ♧
            </button>
            <button class="rail-icon" aria-label="Settings" type="button">
              ⚙
            </button>
            <button class="rail-avatar" aria-label="Your profile" type="button">
              <span class="avatar-head"></span>
              <span class="avatar-body"></span>
            </button>
          </div>
        </nav>

        <aside class="channel-sidebar" aria-label="Workspace channels">
          <button class="sidebar-heading" type="button">
            <span>◷</span> Threads <span class="count-badge">15</span>
          </button>
          <button class="sidebar-heading" type="button">
            <span>♬</span> Buzzes
          </button>

          <div class="section-heading">▾ Channels</div>

          <button class="channel-link" type="button">
            # <span>announcement</span>
          </button>
          <button class="channel-link" type="button">
            # <span>general</span>
          </button>
          <button class="channel-link locked" type="button">
            ♙ <span>hng-lite</span>
          </button>
          <button class="channel-link strong" type="button">
            # <span>hng-premium-plus</span>
          </button>
          <button class="channel-link strong" type="button">
            # <span>payment-confirmation</span>
          </button>
          <button class="channel-link strong" type="button">
            # <span>recordings</span><span class="unread-badge">1</span>
          </button>
          <button class="channel-link strong" type="button">
            # <span>team-formation</span>
          </button>
          <button class="channel-link locked" type="button">
            ♙ <span>zedu-raven</span>
          </button>

          <button class="view-channels" type="button">
            View all channels <span>›</span>
          </button>

          <div class="section-heading people-heading">▾ People</div>
        </aside>

        <main class="channel-main">
          <section
            class="channel-empty-state"
            id="channelEmptyState"
            aria-labelledby="emptyTitle"
          >
            <div class="bell-stage" id="bellStage">
              <img
                id="channelBellmoji"
                class="channel-bellmoji"
                src="public/images/bellmoji/bell-walk-1.png"
                alt="Bellmoji, your friendly workspace guide"
                draggable="false"
              />
              <span class="pointing-hint" id="pointingHint" aria-hidden="true"
                >↖</span
              >
              <span class="paper-plane" id="paperPlane" aria-hidden="true"
                >✈</span
              >
            </div>

            <h1 class="channel-empty-title" id="emptyTitle">
              Select a channel
            </h1>

            <p class="channel-empty-description">
              Psst… pick a channel from the sidebar to get the conversation
              started.
            </p>
          </section>

          <section class="channel-preview" id="channelPreview" hidden>
            <div class="preview-symbol">#</div>
            <h1 id="previewTitle">general</h1>
            <p>This is a preview of the channel screen.</p>
            <button id="backToEmpty" type="button">
              Return to empty state
            </button>
          </section>
        </main>
      </div>
    </div>
  </body>
</html>
